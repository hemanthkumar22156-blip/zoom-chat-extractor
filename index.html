<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoom Chat Extractor</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #e3e9f2;border-radius:18px;box-shadow:0 8px 30px #17203312;padding:22px}.hero{margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}.muted{color:#65738a}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}input[type=file]{max-width:100%}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#1457d9;color:white}button.secondary{background:#e8eefb;color:#16408e}button:disabled{opacity:.5;cursor:not-allowed}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{background:#eef4ff;border-radius:999px;padding:8px 12px;font-size:14px}.table-wrap{overflow:auto;border:1px solid #e5eaf2;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{background:#f7f9fc;font-size:13px;color:#526079}tr:last-child td{border-bottom:0}.status{font-weight:700}.status.help{color:#a35c00}.status.time{color:#6b3cc5}.status.number{color:#137344}.empty{text-align:center;padding:35px;color:#65738a}.note{margin-top:14px;font-size:13px;color:#65738a}
</style>
</head>
<body><main class="wrap"><section class="hero"><h1>Zoom Chat Extractor</h1><div class="muted">Upload a Zoom chat .txt file and extract 10-digit numbers.</div></section>
<section class="card"><div class="controls"><input id="file" type="file" accept=".txt,text/plain"><button id="csv" class="secondary" disabled>Download CSV</button><button id="pdf" disabled>Print / Save PDF</button></div><div id="stats" class="stats"></div><div class="table-wrap"><table><thead><tr><th>S.No</th><th>Chat Time</th><th>Participant Name</th><th>Extracted Number</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Choose a Zoom chat file to begin.</td></tr></tbody></table></div><div class="note">Files are processed locally in your browser. The original message is kept internally for classification but is not displayed.</div></section></main>
<script>
const fileInput=document.querySelector('#file'),rowsEl=document.querySelector('#rows'),statsEl=document.querySelector('#stats'),csvBtn=document.querySelector('#csv'),pdfBtn=document.querySelector('#pdf');let records=[];
const timeWords=/\b(time|when|what time|timing|clock|hour|minute|இன்னும் எத்தனை மணி|நேரம்)\b/i;
function parseLine(line){line=line.trim();if(!line)return null;let m=line.match(/^(?:\[)?(\d{1,2}:\d{2}(?::\d{2})?)(?:\])?\s*(?:-\s*)?([^:]+?)\s*:\s*(.*)$/);if(!m)m=line.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s+(.+?)\s+-\s+(.*)$/);if(!m)return null;let time=m[1],name=m[2].trim(),message=m[3].trim();let numbers=message.match(/\b\d{10}\b/g)||[];let number=numbers[0]||'';let status=number?'Number':/\bhelp\b/i.test(message)?'Help':timeWords.test(message)?'Time':'Others';return{time,name,number,status,message}}
function render(){rowsEl.innerHTML=records.length?records.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.time)}</td><td>${esc(r.name)}</td><td>${esc(r.number)}</td><td class="status ${r.status.toLowerCase()}">${r.status}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No readable chat rows found. Check the Zoom text format.</td>';statsEl.innerHTML=records.length?`<span class="pill">Rows: ${records.length}</span><span class="pill">Numbers: ${records.filter(r=>r.number).length}</span><span class="pill">Help: ${records.filter(r=>r.status==='Help').length}</span><span class="pill">Time: ${records.filter(r=>r.status==='Time').length}</span>`:'';csvBtn.disabled=pdfBtn.disabled=!records.length}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fileInput.addEventListener('change',async()=>{let f=fileInput.files[0];if(!f)return;let text=await f.text();records=text.split(/\r?\n/).map(parseLine).filter(Boolean);render()});
csvBtn.addEventListener('click',()=>{let head=['S.No','Chat Time','Participant Name','Extracted Number','Status'];let out=[head,...records.map((r,i)=>[i+1,r.time,r.name,r.number,r.status])].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='zoom-chat-extracted.csv';a.click();URL.revokeObjectURL(a.href)});
pdfBtn.addEventListener('click',()=>window.print());
</script></body></html>
